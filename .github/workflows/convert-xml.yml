name: Convert to XML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert .cat and .gst files to .xml
        run: |
          mkdir -p xml
          for file in *.cat *.gst; do
            [ -e "$file" ] || continue
            cp "$file" "xml/${file%.*}.xml"
          done
          echo "Converted $(ls xml | wc -l) files"

      - name: Create zip
        run: |
          cd xml
          zip -q "../age-of-sigmar-4th-xml.zip" *.xml
          cd ..
          unzip -l age-of-sigmar-4th-xml.zip | tail -2

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          N=1
          while gh release view "xml-${DATE}-${N}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            N=$((N + 1))
          done
          TAG="xml-${DATE}-${N}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XML data files ${DATE} #${N}" \
            --notes "All .cat and .gst data files converted to XML, zipped." \
            --prerelease \
            age-of-sigmar-4th-xml.zip
