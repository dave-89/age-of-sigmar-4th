name: Weekly upstream sync

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: BSData/age-of-sigmar-4th
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync files from upstream (excluding workflows)
        id: sync
        run: |
          UPSTREAM_DIR="${RUNNER_TEMP}/upstream"
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" "https://github.com/${UPSTREAM_REPO}.git" "$UPSTREAM_DIR"
          rsync -a --delete --exclude '.git' --exclude '.github' "$UPSTREAM_DIR/" ./
          rm -rf "$UPSTREAM_DIR"
          if git diff --quiet; then
            echo "No upstream changes to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Weekly sync from ${UPSTREAM_REPO} ($(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${UPSTREAM_BRANCH}" | cut -c1-7))"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Convert to XML workflow
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          gh workflow run "Convert to XML" --repo "$GITHUB_REPOSITORY" --ref main
